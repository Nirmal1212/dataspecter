# The golden spec. Its generated output is recorded in expected/ and compared byte for byte.
#
# It must only ever use features that existed when the files were recorded, and it must never
# be edited to make a failing comparison pass: a difference means generated values changed.
# New features get their own golden spec beside this one.
version: 1
seed: 20261001
entities:
  # Declared before its parents on purpose.
  order_item:
    count: 400
    fields:
      id: {type: sequence}
      order_id: $order.id
      order_customer: $order.customer_id
      product_id: $product.id
      unit_price: $product.price
      quantity: {type: integer, ranges: [1 to 1 || 60, 2 to 3 || 30, 4 to 10 || 10]}
      gift_wrap_level: {type: choice, value_type: integer, values: [0 || 80, 1 || 15, 2 || 5]}
      discounted_price:
        type: reference
        entity: product
        field: price
        null_probability: 0.5

  order:
    count: 150
    fields:
      id: {type: uuid}
      customer_id: $customer.id
      customer_tier: $customer.tier
      status:
        type: choice
        values: [delivered, shipped, pending, cancelled]
        weights: [0.75, 0.12, 0.08, 0.05]
      placed_at: {type: datetime, min: 2025-01-01T00:00:00, max: 2025-12-31T23:59:59}
      discount_pct: {type: integer, min: 5, max: 30, null_probability: 0.6}
      note: {type: choice, values: ["plain", "has, comma", 'has "quotes"', "$5.00"]}

  transfer:
    count: 120
    fields:
      sender_id: {type: reference, entity: customer, field: id, link: sender}
      sender_tier: {type: reference, entity: customer, field: tier, link: sender}
      receiver_id: {type: reference, entity: customer, field: id, link: receiver}
      owner_id: $customer.id
      amount: {type: float, min: 1, max: 9999, precision: 2}

  product:
    count: 30
    fields:
      id: {type: sequence, start: 100, step: 5}
      category: {type: choice, values: [books, games, music, tools]}
      price:
        type: float
        distribution: normal
        mean: 40
        stddev: 15
        min: 5
        max: 200
        precision: 2
      weight_kg: {type: float, min: 0.1, max: 25}
      rating: {type: integer, distribution: normal, mean: 4, stddev: 1, min: 1, max: 5}
      currency: {type: constant, value: EUR}
      in_stock: {type: boolean, true_probability: 0.9}
      launched: {type: date, min: 2020-01-01, max: 2025-12-31}

  customer:
    count: 60
    fields:
      id: {type: sequence, start: 1001}
      external_ref: {type: uuid}
      tier: {type: choice, values: [free || 70, pro || 25, enterprise || 5]}
      age:
        type: integer
        ranges:
          - {min: 18, max: 35, weight: 0.7}
          - 36 to 60 || 0.25
          - 61 to 90 || 0.05
      score: {type: float, ranges: [-10.5 to -0.5 || 1, 0.4 to .9 || 3], precision: 1}
      marketing_opt_in: {type: boolean, true_probability: 0.3}
      signup_date: {type: date, min: 2022-01-01, max: 2025-12-31}
      referral_code:
        type: choice
        values: [FRIEND10 || 0.2, LAUNCH25 || 0.2, PARTNER || 0.1, " || 0.5"]
      nickname: {type: choice, values: [Ace, null], weights: [1, 3]}
      always_null: {type: integer, min: 1, max: 2, null_probability: 1}
