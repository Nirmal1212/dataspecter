# A small web shop: customers place orders, orders contain items, items point at products.
# Run it with:  dataspecter generate examples/shop.yaml
#
# This file uses the shorthand forms. docs/spec-reference.md shows the long form of each.
version: 1
seed: 42
# Names, phone numbers and addresses are Indian. Run with --locale en_US for American ones.
locale: en_IN
output:
  format: csv
  dir: output/shop

# Reusable definitions. A field uses one with type: <name>.
types:
  money:
    type: object
    fields:
      amount: {type: float, min: 5, max: 500, precision: 2}
      currency: {type: constant, value: EUR}

entities:
  customer:
    count: 1000
    fields:
      id: {type: sequence, start: 1001}
      external_ref: {type: uuid}
      # Built-in realistic types need no lists. Hidden fields are generated and can be read by
      # templates, but are not written out.
      first_name: {type: first_name, hidden: true}
      last_name: {type: last_name, hidden: true}
      # A template builds text from other fields of the same record. slug makes any name
      # safe for an email address.
      name: {type: template, template: "{first_name} {last_name}"}
      email: {type: template, template: "{first_name|slug}.{last_name|slug}@example.com"}
      mobile: {type: phone, unique: true}
      # value || weight: 70% free, 25% pro, 5% enterprise. Weights are relative.
      tier: {type: choice, values: [free || 70, pro || 25, enterprise || 5]}
      # min to max || weight: most customers are young, a few are over 60.
      age: {type: integer, ranges: [18 to 35 || 0.7, 36 to 60 || 0.25, 61 to 90 || 0.05]}
      country: {type: choice, values: [IN, US, GB, DE]}
      marketing_opt_in: {type: boolean, true_probability: 0.3}
      signup_date: {type: date, min: 2022-01-01, max: 2025-12-31}
      # An empty value is null: half of the customers have no referral code.
      referral_code:
        type: choice
        values: [FRIEND10 || 0.2, LAUNCH25 || 0.2, PARTNER || 0.1, " || 0.5"]
      # An address is an object: street, city, state, postcode and country, consistent with
      # each other. In CSV it becomes the columns address.street, address.city and so on; in
      # JSON it stays nested. One customer in ten has no address.
      address: {type: address, null_probability: 0.1}

  product:
    count: 50
    fields:
      id: {type: sequence}
      # A pattern: ? is a letter, # a digit. unique means no two products share a code.
      code: {type: pattern, pattern: "SKU-??-####", unique: true}
      # The custom type above, with one of its fields overridden.
      list_price:
        type: money
        fields:
          currency: {type: constant, value: USD}
      category: {type: choice, values: [books, games, music, tools]}
      # A bell curve around 40, never below 5 or above 200.
      price:
        type: float
        distribution: normal
        mean: 40
        stddev: 15
        min: 5
        max: 200
        precision: 2
      currency: {type: constant, value: EUR}
      in_stock: {type: boolean, true_probability: 0.9}

  order:
    count: 5000
    fields:
      id: {type: uuid}
      # $entity.field: each order belongs to one generated customer, and both fields below
      # are read from that same customer.
      customer_id: $customer.id
      customer_tier: $customer.tier
      # A reference can read inside an object. Null when that customer has no address.
      ship_city: $customer.address.city
      status:
        type: choice
        values: [delivered || 0.75, shipped || 0.12, pending || 0.08, cancelled || 0.05]
      placed_at: {type: datetime, min: 2025-01-01T00:00:00, max: 2025-12-31T23:59:59}
      discount_pct: {type: integer, min: 5, max: 30, null_probability: 0.6}

  order_item:
    count: 12000
    fields:
      id: {type: sequence}
      order_id: $order.id
      # The id and the price come from the same product.
      product_id: $product.id
      unit_price: $product.price
      quantity: {type: integer, ranges: [1 to 1 || 60, 2 to 3 || 30, 4 to 10 || 10]}
      # value_type makes the inline values integers instead of text.
      gift_wrap_level: {type: choice, value_type: integer, values: [0 || 80, 1 || 15, 2 || 5]}
