schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

context: |
  Project: dataspecter. Config-driven synthetic data simulator: define entities, value ranges and probability distributions in YAML or JSON, then export realistic data as CSV, JSON, or a stream to an HTTP endpoint.
  Tech stack: not decided yet (update this line once it is).
  Process: Git Flow, Conventional Commits and SemVer. The full rules are in CONTRIBUTING.md.
  - One OpenSpec change = one feature/<change-name> branch off develop = one pull request.
  - Change names are kebab-case and start with a verb (add-, update-, remove-, fix-).
  - A change is archived on its feature branch before the pull request merges.

rules:
  tasks:
    - Group tasks so that each group can land as one Conventional Commit
    - End with tasks for tests, a CHANGELOG.md entry under [Unreleased], and archiving the change
